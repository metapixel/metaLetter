name: Release (signiert & notarisiert)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, z. B. 1.0.1'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Developer-ID-Zertifikat importieren
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen
          echo "DEVELOPMENT_TEAM = $TEAM_ID" > Xcode/Local.xcconfig
          xcodegen

      - name: Archivieren
        run: |
          xcodebuild -project metaLetter.xcodeproj -scheme metaLetter -configuration Release \
            -archivePath "$RUNNER_TEMP/metaLetter.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" OTHER_CODE_SIGN_FLAGS="--timestamp" \
            archive

      - name: Exportieren (Developer ID)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/metaLetter.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"

      - name: Notarisieren & Ticket anheften
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd "$RUNNER_TEMP/export"
          ditto -c -k --keepParent metaLetter.app upload.zip
          xcrun notarytool submit upload.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple metaLetter.app
          spctl --assess --type execute --verbose metaLetter.app
          ditto -c -k --keepParent metaLetter.app "$GITHUB_WORKSPACE/metaLetter-$VERSION.zip"

      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "metaLetter-$VERSION.zip" \
            --title "metaLetter $VERSION" --generate-notes --target "$GITHUB_SHA"

      - name: Aufräumen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
