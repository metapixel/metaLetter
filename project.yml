name: metaLetter
options:
  bundleIdPrefix: de.metapixel
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: de
configFiles:
  Debug: Xcode/Config.xcconfig
  Release: Xcode/Config.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  metaLetter:
    type: application
    platform: macOS
    sources:
      - path: Sources/metaLetter
      - path: Xcode/Assets.xcassets
    info:
      path: Xcode/Info.plist
      properties:
        CFBundleDisplayName: metaLetter
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Kai Kranz"
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: metaLetter
        PRODUCT_BUNDLE_IDENTIFIER: de.metapixel.metaLetter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
